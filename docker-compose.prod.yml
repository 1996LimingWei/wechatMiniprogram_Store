services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - ./deploy/data/mysql:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./deploy/backups/mysql:/backups
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - ./deploy/data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./shop-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      APP_EXTERNAL_BASE_URL: ${APP_EXTERNAL_BASE_URL}
      WEB_CORS_ALLOWED_ORIGIN_PATTERNS: ${WEB_CORS_ALLOWED_ORIGIN_PATTERNS}
      WX_MA_APPID: ${WX_MA_APPID}
      WX_MA_SECRET: ${WX_MA_SECRET}
      WECHAT_PAY_ENABLED: ${WECHAT_PAY_ENABLED}
      WECHAT_PAY_APP_ID: ${WECHAT_PAY_APP_ID}
      WECHAT_PAY_MCH_ID: ${WECHAT_PAY_MCH_ID}
      WECHAT_PAY_MERCHANT_SERIAL_NO: ${WECHAT_PAY_MERCHANT_SERIAL_NO}
      WECHAT_PAY_PRIVATE_KEY_PATH: ${WECHAT_PAY_PRIVATE_KEY_PATH}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY}
      WECHAT_PAY_PLATFORM_CERTIFICATE_PATH: ${WECHAT_PAY_PLATFORM_CERTIFICATE_PATH}
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL}
      TRADE_REFUND_PROVIDER: ${TRADE_REFUND_PROVIDER}
      TRADE_LOGISTICS_PROVIDER: ${TRADE_LOGISTICS_PROVIDER}
      KUAIDI100_CUSTOMER: ${KUAIDI100_CUSTOMER}
      KUAIDI100_KEY: ${KUAIDI100_KEY}
      MATERIAL_STORAGE_PROVIDER: ${MATERIAL_STORAGE_PROVIDER}
      MATERIAL_STORAGE_ROOT: ${MATERIAL_STORAGE_ROOT}
      MATERIAL_PUBLIC_BASE_URL: ${MATERIAL_PUBLIC_BASE_URL}
      MATERIAL_ALLOWED_URL_PREFIXES: ${MATERIAL_ALLOWED_URL_PREFIXES}
      MATERIAL_MAX_SIZE: ${MATERIAL_MAX_SIZE}
      TRADE_FREE_FREIGHT_THRESHOLD: ${TRADE_FREE_FREIGHT_THRESHOLD}
      TRADE_BASE_FREIGHT_FEE: ${TRADE_BASE_FREIGHT_FEE}
      TZ: Asia/Shanghai
    volumes:
      - ./deploy/logs/backend:/app/logs
      - ./deploy/data/material:/app/material
      - ./deploy/secrets/wechat-pay:/run/secrets/wechat-pay:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin:
    build:
      context: ./shop-admin
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8085
    depends_on:
      backend:
        condition: service_started

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/shop.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/secrets/tls:/etc/nginx/tls:ro
      - ./deploy/logs/nginx:/var/log/nginx
      - ./deploy/data/material:/usr/share/nginx/material:ro
    depends_on:
      admin:
        condition: service_started
      backend:
        condition: service_started
