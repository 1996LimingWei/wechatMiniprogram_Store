# ============================================
# 预发布环境配置
# 用途：客户验收、真实渠道小额联调、生产发布前回归。
# 敏感信息必须通过环境变量注入，不允许写入仓库。
# 使用方式：--spring.profiles.active=staging
# ============================================

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

wx:
  ma:
    appid: ${WX_MA_APPID:}
    secret: ${WX_MA_SECRET:}
    mock-enabled: false

member:
  features:
    membership-enabled: false
    profile-edit-enabled: false

wechat:
  pay:
    enabled: ${WECHAT_PAY_ENABLED:false}
    app-id: ${WECHAT_PAY_APP_ID:}
    mch-id: ${WECHAT_PAY_MCH_ID:}
    merchant-serial-no: ${WECHAT_PAY_MERCHANT_SERIAL_NO:}
    private-key-path: ${WECHAT_PAY_PRIVATE_KEY_PATH:}
    api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
    platform-certificate-path: ${WECHAT_PAY_PLATFORM_CERTIFICATE_PATH:}
    notify-url: ${WECHAT_PAY_NOTIFY_URL:}
    reconcile-job-enabled: true
    reconcile-job-fixed-delay: ${WECHAT_PAY_RECONCILE_FIXED_DELAY:60000}
    reconcile-batch-size: ${WECHAT_PAY_RECONCILE_BATCH_SIZE:50}

product:
  provider: database
  mock-endpoints-enabled: false

trade:
  mock-actions-enabled: false
  refund:
    provider: ${TRADE_REFUND_PROVIDER:wechat}
    sync-job-enabled: true
    sync-job-fixed-delay: ${TRADE_REFUND_SYNC_FIXED_DELAY:60000}
    sync-batch-size: ${TRADE_REFUND_SYNC_BATCH_SIZE:50}
    max-auto-attempts: ${TRADE_REFUND_MAX_AUTO_ATTEMPTS:12}
    claim-seconds: ${TRADE_REFUND_CLAIM_SECONDS:120}
    return-expire-batch-size: ${TRADE_RETURN_EXPIRE_BATCH_SIZE:100}
    return-expire-job-fixed-delay: ${TRADE_RETURN_EXPIRE_FIXED_DELAY:3600000}
  logistics:
    provider: ${TRADE_LOGISTICS_PROVIDER:kuaidi100}
    kuaidi100:
      customer: ${KUAIDI100_CUSTOMER:}
      key: ${KUAIDI100_KEY:}
  freight:
    free-threshold: ${TRADE_FREE_FREIGHT_THRESHOLD:19900}
    base-fee: ${TRADE_BASE_FREIGHT_FEE:1000}
  order:
    unpaid-timeout-minutes: ${TRADE_UNPAID_TIMEOUT_MINUTES:30}
    expire-job-enabled: true
    expire-batch-size: ${TRADE_EXPIRE_BATCH_SIZE:100}
    auto-confirm-days: ${TRADE_AUTO_CONFIRM_DAYS:10}
    auto-confirm-batch-size: ${TRADE_AUTO_CONFIRM_BATCH_SIZE:100}
    auto-confirm-job-fixed-delay: ${TRADE_AUTO_CONFIRM_FIXED_DELAY:3600000}

admin:
  auth:
    max-failed-attempts: ${ADMIN_MAX_FAILED_ATTEMPTS:5}
    lock-minutes: ${ADMIN_LOCK_MINUTES:15}

web:
  cors:
    allowed-origin-patterns: ${WEB_CORS_ALLOWED_ORIGIN_PATTERNS:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.shop: info

app:
  external-base-url: ${APP_EXTERNAL_BASE_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

